# Local Kubernetes cluster for this project (kind = Kubernetes in Docker).
# Maps the two NodePorts to the same ports on the host, so the app is at
# http://localhost:30080 and the page finds stats-api at localhost:30081.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30081
        hostPort: 30081
